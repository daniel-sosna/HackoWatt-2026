[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackowatt-family"
version = "0.1.0"
description = "Composable synthetic household-energy data application"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "tzdata>=2025.1",
  "reportlab>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "scikit-learn>=1.6,<1.8",
  "catboost>=1.2,<1.3",
  "matplotlib>=3.10,<3.11",
]

[project.scripts]
hackowatt = "hackowatt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hackowatt.presentation = ["assets/*.html", "assets/renewable/*"]
